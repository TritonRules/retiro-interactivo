name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Validate data
        run: npm run validate:data

      - name: Check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build candidate
        run: |
          export SITE="${SITE_VAR:-https://${GITHUB_REPOSITORY_OWNER}.github.io}"
          export BASE="${BASE_VAR:-/${GITHUB_REPOSITORY##*/}}"
          npm run build
        env:
          SITE_VAR: ${{ vars.SITE }}
          BASE_VAR: ${{ vars.BASE }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
