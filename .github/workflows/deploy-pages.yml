name: Deploy GitHub Pages

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        # @vite-pwa/astro peers Astro ≤5; project uses Astro 7 — see docs/legacy-peer-deps.md
        run: npm ci --legacy-peer-deps

      - name: Validate data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Check
        run: npm run check

      - name: Build
        run: |
          export SITE="${SITE_VAR:-https://${GITHUB_REPOSITORY_OWNER}.github.io}"
          export BASE="${BASE_VAR:-/${GITHUB_REPOSITORY##*/}}"
          echo "Building with SITE=$SITE BASE=$BASE"
          npm run build
        env:
          SITE_VAR: ${{ vars.SITE }}
          BASE_VAR: ${{ vars.BASE }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
