name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Check
        run: npm run check

      - name: Build
        run: |
          export SITE="${SITE_VAR:-https://${GITHUB_REPOSITORY_OWNER}.github.io}"
          export BASE="${BASE_VAR:-/${GITHUB_REPOSITORY##*/}}"
          echo "Building with SITE=$SITE BASE=$BASE"
          npm run build
        env:
          SITE_VAR: ${{ vars.SITE }}
          BASE_VAR: ${{ vars.BASE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
